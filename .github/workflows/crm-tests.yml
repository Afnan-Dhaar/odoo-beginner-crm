name: CRM Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out CRM module
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out Odoo 19
        run: git clone --depth 1 --branch 19.0 https://github.com/odoo/odoo.git odoo

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Odoo dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r odoo/requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: odoo
        run: createdb -h 127.0.0.1 -U odoo odoo_test

      - name: Run CRM tests
        run: >-
          python odoo/odoo-bin
          --addons-path=odoo/addons,custom-addons
          --db_host=127.0.0.1
          --db_port=5432
          --db_user=odoo
          --db_password=odoo
          -d odoo_test
          -i my_first_module
          --test-enable
          --stop-after-init